[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragnoz"
version = "0.2.0"
description = "A local-first RAG evaluation, attribution, and architecture diagnosis CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "RAGnoz contributors"}]
dependencies = [
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "jinja2>=3.1,<4",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2", "types-PyYAML>=6,<7"]

[project.scripts]
ragnoz = "ragnoz.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ragnoz.data.demo" = ["*.jsonl", "*.json", "*.md", "*.yaml", "*.py", "pipelines/*.yaml"]
"ragnoz.data.rules" = ["*.yaml"]
"ragnoz.data.symptoms" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[tool.coverage.run]
source = ["ragnoz"]
branch = true
omit = [
  # Bundled example/data module for end users (`ragnoz.data.demo:build_demo_adapter`),
  # not exercised by RAGnoz's own test suite and not part of its measured logic.
  "*/ragnoz/data/demo/adapter.py",
  "*/ragnoz/data/demo/__init__.py",
]

[tool.coverage.report]
fail_under = 85
